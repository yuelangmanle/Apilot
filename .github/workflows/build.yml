name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'
      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release-key.jks
      - name: Create key.properties
        run: |
          echo "storePassword=${{ secrets.KEY_STORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=release-key.jks" >> android/key.properties
      - name: Install dependencies
        run: flutter pub get
      - name: Build APK
        run: flutter build apk --release
      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-release.apk Apilot-${{ github.ref_name }}.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: Apilot-${{ github.ref_name }}.apk

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'
      - name: Install dependencies
        run: flutter pub get
      - name: Build macOS
        run: flutter build macos --release
      - name: Find app bundle
        run: find build/macos -name "*.app" -type d
      - name: Create DMG
        run: |
          APP_PATH=$(find build/macos -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then echo "App bundle not found!" && exit 1; fi
          mkdir -p dmg_source
          cp -r "$APP_PATH" dmg_source/Apilot.app
          ln -s /Applications dmg_source/Applications
          hdiutil create -volname "Apilot" -srcfolder dmg_source -ov -format UDZO Apilot-${{ github.ref_name }}.dmg
      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: Apilot-${{ github.ref_name }}.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'
      - name: Install dependencies
        run: flutter pub get
      - name: Build Windows
        run: flutter build windows --release
      - name: Create portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath Apilot-${{ github.ref_name }}-windows-portable.zip -Force
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Create Windows installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $env:APILOT_VERSION = $version
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" windows\installer\Apilot.iss
          Copy-Item "build\windows-installer\Apilot-$version-windows-setup.exe" "Apilot-${{ github.ref_name }}-windows-setup.exe"
      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: Apilot-${{ github.ref_name }}-windows-portable.zip
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: Apilot-${{ github.ref_name }}-windows-setup.exe

  release:
    needs: [build-android, build-macos, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: apk
      - name: Download DMG
        uses: actions/download-artifact@v4
        with:
          name: macos-dmg
      - name: Download Windows ZIP
        uses: actions/download-artifact@v4
        with:
          name: windows-zip
      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
      - name: Extract current changelog
        run: dart tool/extract_changelog.dart "${{ github.ref_name }}" RELEASE_NOTES.md
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Apilot-${{ github.ref_name }}.apk
            Apilot-${{ github.ref_name }}.dmg
            Apilot-${{ github.ref_name }}-windows-setup.exe
            Apilot-${{ github.ref_name }}-windows-portable.zip
          name: "🚀 Apilot ${{ github.ref_name }}"
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
